;*************************************************************90_ShadowFix1Special********************************************************
;special for ThePathless
[ShaderRegex_90_ShadowFix1Special]
shader_model = ps_5_0
temps = stereo
[ShaderRegex_90_ShadowFix1Special.Pattern]
(?n)(?P<section1>^\s*add r\d{1,2}\.[xyzw]{2}, v\d\.[xyzw]{4}, -cb[0123]\[\d{3}\]\.[xyzw]{4}$\n
^\s*mad r\d{1,2}\.[xyzw]{2}, r\d{1,2}\.[xyzw]{4}, cb[0123]\[\d{3}\]\.[xyzw]{4}, .*?$\n)
(?s)(?P<rest>^.*?$)\n
(?P<section2>^\s*mul r\d{1,2}\.[xyzw]{3}, r\d{1,2}\.[xyzw]{4}, cb[0123]\[\d{2}\]\.[xyzw]{4}$\n
^\s*mad r\d{1,2}\.[xyzw]{3}, (?P<FixReg>r\d{1,2})\.(?P<FixRegSwiz>[xyzw])(?P=FixRegSwiz)(?P=FixRegSwiz)(?P=FixRegSwiz), cb[0123]\[\d{2}\]\.[xyzw]{4}, r\d{1,2}\.[xyzw]{4}$\n
^\s*add r\d{1,2}\.[xyzw]{3}, r\d{1,2}\.[xyzw]{4}, cb[0123]\[\d{2}\]\.[xyzw]{4}$\n)
[ShaderRegex_90_ShadowFix1Special.Pattern.Replace]
${section1}\n
${rest}\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${FixReg}.${FixRegSwiz}, ${FixReg}.${FixRegSwiz}, -${stereo}.x\n
${section2}\n
[ShaderRegex_90_ShadowFix1Special.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
