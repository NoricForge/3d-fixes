;*****************************************************************66_HaloEffectDisable****************************************************************
[ShaderRegex_66_HaloEffectDisable]
shader_model = vs_5_0
temps = stereo
[ShaderRegex_66_HaloEffectDisable.Pattern]
(?n)(?P<section1>^mov r\d\.[xyzw], l\(0\)$\n
^add r\d\.[xyzw]{2}, r\d\.[xyzw]{4}, r\d\.[xyzw]{4}$\n
^add r\d\.[xyzw]{2}, r\d\.[xyzw]{4}, -cb(?P<CBNR>\d)\[(?P<CBREG>\d{2})\]\.[xyzw]{4}$\n
^div (?P<Output>o2)\.[xyzw]{2}, r\d\.[xyzw]{4}, cb(?P=CBNR)\[(?P=CBREG)\]\.[xyzw]{4}$\n)
(?P<section2>^mov (?P<Skipp>(?P<Operation1>(?P=Output))\.(?P<OperationSwizzle1>[xyzw]{2}), l\(0,0,0,1\.000000\))$\n)
(?P<section3>^mov o0\.[xyzw]{2}, r\d\.[xyzw]{4}$\n
^ret$\n)
[ShaderRegex_66_HaloEffectDisable.Pattern.Replace]
${section1}\n
mov ${Operation1}.${OperationSwizzle1}, l(0,0,0,0.000000)\n
${section3}\n
[ShaderRegex_66_HaloEffectDisable.InsertDeclarations]
