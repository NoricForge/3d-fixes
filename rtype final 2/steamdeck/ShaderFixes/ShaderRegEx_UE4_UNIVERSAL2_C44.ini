[ShaderRegex_01_DynamicLights3]
shader_model = cs_5_0 ps_5_0
temps = stereo tmp11 tmp12
[ShaderRegex_01_DynamicLights3.Pattern]
(?n)\/\/DynLightsMoreCought\n
(?s)(?P<rest>^.*?$)\n
(?P<section3x>^\s*mad r\d{1,2}\.[xyzw], r\d{1,2}\.[xyzw], cb[0123]\[\d{1,3}\]\.[xyzw], cb[0123]\[\d{1,3}\]\.[xyzw]$\n
^\s*movc r\d{1,2}\.[xyzw], r\d{1,2}\.[xyzw], r\d{1,2}\.[xyzw], r\d{1,2}\.[xyzw]$\n)
(?P<section1>^\s*mul r\d{1,2}(?P<Line1Replace1>\.[xyzw]{3,4}, r\d{1,2}\.[xyzw]{4}, cb0\[[256]\d\]\.[xyzw]{4})$\n)
(?P<section11>^\s*mad (?P<OriginalReg>r\d{1,2})(?P<Line2Replace1>\.[xyzw]{3,4}), (?P<Line2Replace2>(?P<ResWidth>r\d{1,2})\.(?P<SwizzToFIXX>[xyzw])(?P=SwizzToFIXX)(?P=SwizzToFIXX)(?P=SwizzToFIXX)), (?P<Line2Replace3>cb0\[[256]\d\]\.[xyzw]{4}), (?P<ExtraRegReplace>r\d{1,2}(?P<Line2Replace4>\.[xyzw]{4}))$\n)
(?P<section2>^\s*mad r\d{1,2}(?P<Line3Replace1>\.[xyzw]{3,4}, r\d{1,2}\.[xyzw]{4}, cb0\[[256]\d\]\.[xyzw]{4}), r\d{1,2}(?P<Line3Replace2>\.[xyzw]{4})$\n
^\s*add r\d{1,2}(?P<Line4Replace1>\.[xyzw]{3}(?P<GetW>[xyzw])), r\d{1,2}(?P<Line4Replace2>\.[xyzw]{4}, cb0\[[256]\d\]\.[xyzw]{4})$\n)
(?P<section3>^\s*div (?P<pos>r\d{1,2})\.[xyzw]{2,4}, r\d{1,2}\.[xyzw]{4}, r\d{1,2}\.(?P<WSWIZZ>[xyzw])(?P=WSWIZZ)(?P=WSWIZZ)(?P=WSWIZZ)$\n)
(?P<section6>^\s*add r\d{1,2}\.[xyzw]{3}, (-|)r\d{1,2}\.[xyzw]{4}, (-|)cb(?P<CBNR>\d{1,3})\[(?P<CBReg>\d{1,3})\]\.[xyzw]{4}$\n
^\s*add r\d{1,2}\.[xyzw]{3}, (-|)r\d{1,2}\.[xyzw]{4}, ((-|)r\d{1,2}\.[xyzw]{4}|(-|)cb[0123]\[\d{1,3}\]\.[xyzw]{4})$\n)
[ShaderRegex_01_DynamicLights3.Pattern.Replace]
\n
${rest}\n
${section3x}\n
mul ${tmp11}${Line1Replace1}\n
mad ${tmp11}${Line2Replace1}, ${Line2Replace2}, ${Line2Replace3}, ${tmp11}${Line2Replace4}\n
//PS\n
mad ${tmp11}${Line3Replace1}, ${tmp11}${Line3Replace2}\n
add ${tmp11}${Line4Replace1}, ${tmp11}${Line4Replace2}\n
mov ${tmp12}.xyzw, ${ResWidth}.xyzw\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
mul ${stereo}.w, ${stereo}.y, ${tmp11}.${GetW}\n
add ${stereo}.w, ${stereo}.w, l(-1.0)\n
mad ${tmp12}.${SwizzToFIXX}, ${stereo}.x, ${stereo}.w, ${tmp12}.${SwizzToFIXX}\n
${section1}\n
mad ${OriginalReg}${Line2Replace1}, ${tmp12}.${SwizzToFIXX}${SwizzToFIXX}${SwizzToFIXX}${SwizzToFIXX}, ${Line2Replace3}, ${ExtraRegReplace}\n
//PS\n
${section2}\n
${section3}\n
${section6}\n
//DynLightsMoreCought2\n
[ShaderRegex_01_DynamicLights3.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
