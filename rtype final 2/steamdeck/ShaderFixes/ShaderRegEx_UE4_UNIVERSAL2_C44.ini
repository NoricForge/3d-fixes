;**************************************ShaderRegex_GetUE4Global_DepthBuffer_1**************************************
[ShaderRegex_GetUE4Global_DepthBuffer_1]
shader_model = vs_5_0
if ($framelimit <= 3)
$framelimit = $framelimit+1
if x49==1.0
if x22==0.0
Resource\ShaderFixes\auto_convergence.ini\DepthBuffer=oD unless_null
Resource\ShaderFixes\auto_convergence.ini\_gGlobalParam=vs-cb1
endif
endif
if x49==0.0
if x22==1.0
Resource\ShaderFixes\auto_convergence.ini\DepthBuffer=oD unless_null
Resource\ShaderFixes\auto_convergence.ini\_gGlobalParam=vs-cb1
endif
endif
if x49==1.0
if x22==1.0
Resource\ShaderFixes\auto_convergence.ini\DepthBuffer=oD unless_null
Resource\ShaderFixes\auto_convergence.ini\_gGlobalParam=vs-cb1
endif
endif
endif
[ShaderRegex_GetUE4Global_DepthBuffer_1.Pattern]
(?P<Section1>^\s*dcl_output_siv o\d\.[xyzw]{4}, position$\n
^\s*dcl_temps \d$\n
^\s*mad r\d{1,2}\.[xyzw]{3}, v\d{1,2}\.[xyzw]{4}, cb0\[\d\]\.(?P<SwizzW1>[xyzw])(?P=SwizzW1)(?P=SwizzW1)(?P=SwizzW1), cb0\[\d\]\.[xyzw]{4}$\n
^\s*mul r\d{1,2}\.[xyzw]{4}, r\d{1,2}\.(?P<SwizzY1>[xyzw])(?P=SwizzY1)(?P=SwizzY1)(?P=SwizzY1), cb1\[1\]\.[xyzw]{4}$\n
^\s*mad r\d{1,2}\.[xyzw]{4}, r\d{1,2}\.(?P<SwizzX1>[xyzw])(?P=SwizzX1)(?P=SwizzX1)(?P=SwizzX1), cb1\[0\]\.[xyzw]{4}, r\d{1,2}\.[xyzw]{4}$\n
^\s*mad r\d{1,2}\.[xyzw]{4}, r\d{1,2}\.(?P<SwizzZ1>[xyzw])(?P=SwizzZ1)(?P=SwizzZ1)(?P=SwizzZ1), cb1\[2\]\.[xyzw]{4}, r\d{1,2}\.[xyzw]{4}$\n
^\s*add o\d{1,2}\.[xyzw]{4}, r\d{1,2}\.[xyzw]{4}, cb1\[3\]\.[xyzw]{4}$\n
^\s*ret$\n)
[ShaderRegex_GetUE4Global_DepthBuffer_1.Pattern.Replace]
\n
${Section1}\n
